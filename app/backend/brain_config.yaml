# ------------------------------------------------------------------------------
# 6. Pipeline Subsystem Settings
# ------------------------------------------------------------------------------
whisper:
  model_size: "small"
  device: "cpu"
  compute_type: "int8"
  vad_filter: true
  language: null

embedding:
  model: "models/gemini-embedding-2"
  dimension: 3072
  batch_size: 25
  rate_limit_per_min: 60
  rate_limit_per_day: 1000
  rate_limit_tpm: 28000
  max_workers: 4

qdrant:
  url: "http://localhost:6333"
  api_key: null
  collection_name: "second_brain"
  vector_size: 3072
  distance: "Cosine"
  batch_size: 100

chunk_size: 1500
chunk_overlap: 200
